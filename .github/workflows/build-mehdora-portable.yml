name: Build MEHDORA Portable

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "portable/**"
      - ".github/workflows/build-mehdora-portable.yml"

permissions:
  contents: read

jobs:
  windows-portable:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download stable Windows engine
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://download.kde.org/stable/krita/6.0.3/krita-x64-6.0.3.zip" `
            -OutFile "engine.zip"
          Expand-Archive engine.zip -DestinationPath engine
      - name: Assemble MEHDORA
        shell: pwsh
        run: |
          $engineRoot = Get-ChildItem engine -Directory | Select-Object -First 1
          if (-not $engineRoot) { throw "Engine folder was not found." }
          $destination = "package/MEHDORA-Textile-Studio"
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          Copy-Item "$($engineRoot.FullName)/*" $destination -Recurse -Force
          $pluginRoot = "$destination/share/krita/pykrita"
          New-Item -ItemType Directory -Path $pluginRoot -Force | Out-Null
          Copy-Item portable/plugin/mehdora_color_lab $pluginRoot -Recurse -Force
          Copy-Item portable/plugin/mehdora_color_lab.desktop $pluginRoot -Force
          Copy-Item portable/MEHDORA-Splash.png $destination -Force
          Copy-Item portable/README-FA.txt $destination -Force
          Copy-Item portable/THIRD-PARTY-NOTICES.txt $destination -Force
      - name: Build MEHDORA launcher
        shell: pwsh
        run: |
          $compiler = "$env:WINDIR/Microsoft.NET/Framework64/v4.0.30319/csc.exe"
          if (-not (Test-Path $compiler)) { throw "Windows C# compiler was not found." }
          $launcherSource = Get-ChildItem `
            -Path . `
            -Filter "MEHDORA-Launcher.cs" `
            -File `
            -Recurse | Select-Object -First 1
          if (-not $launcherSource) {
            throw "MEHDORA-Launcher.cs was not found anywhere in the repository."
          }
          Write-Host "Launcher source: $($launcherSource.FullName)"
          & $compiler /nologo /target:winexe `
            /reference:System.Windows.Forms.dll `
            /reference:System.Drawing.dll `
            /out:package/MEHDORA-Textile-Studio/MEHDORA-Textile-Studio.exe `
            $launcherSource.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package MEHDORA
        shell: pwsh
        run: |
          Compress-Archive `
            -Path package/MEHDORA-Textile-Studio `
            -DestinationPath MEHDORA-Textile-Studio-Windows-Portable.zip
      - name: Validate package
        shell: pwsh
        run: |
          if (-not (Test-Path "package/MEHDORA-Textile-Studio/MEHDORA-Textile-Studio.exe")) {
            throw "MEHDORA launcher was not created."
          }
          if (-not (Test-Path "package/MEHDORA-Textile-Studio/share/krita/pykrita/mehdora_color_lab/mehdora_color_lab.py")) {
            throw "MEHDORA Color Lab was not packaged."
          }
          if (-not (Test-Path "package/MEHDORA-Textile-Studio/MEHDORA-Splash.png")) {
            throw "MEHDORA splash image was not packaged."
          }
      - uses: actions/upload-artifact@v4
        with:
          name: MEHDORA-Textile-Studio-Windows-Portable
          path: MEHDORA-Textile-Studio-Windows-Portable.zip
          retention-days: 14
          if-no-files-found: error
